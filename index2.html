<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Control de Vencimientos</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --primary: #6c5ce7;
      --primary-dark: #5546d8;
      --primary-light: #eeeaff;
      --accent: #00b894;
      --danger: #ff4d67;
      --warning: #f6a623;
      --bg: #f5f6fb;
      --card: #ffffff;
      --text: #20253a;
      --muted: #8991aa;
      --border: #e8eaf2;
      --shadow: 0 12px 35px rgba(45, 48, 80, .08);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 92px;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ================= HEADER ================= */

    header {
      background: linear-gradient(135deg, #6655e9 0%, #8d4de8 100%);
      color: white;
      padding: 24px 20px 28px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 8px 25px rgba(91, 70, 200, .18);
    }

    .header-inner {
      max-width: 650px;
      margin: auto;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.6px;
      opacity: .78;
      margin-bottom: 5px;
    }

    header h1 {
      font-size: 25px;
      line-height: 1.15;
      font-weight: 800;
    }

    .header-subtitle {
      margin-top: 7px;
      font-size: 14px;
      opacity: .88;
    }

    /* ================= LOVE MESSAGE ================= */

    #love-message {
      display: none;
      max-width: 650px;
      margin: -8px auto 0;
      position: relative;
      z-index: 110;
      padding: 0 16px;
    }

    .love-inner {
      background: white;
      color: #7659db;
      border-radius: 0 0 18px 18px;
      padding: 9px 15px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 7px 18px rgba(50,40,90,.08);
      animation: loveAppear .5s ease;
    }

    @keyframes loveAppear {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ================= SYNC ================= */

    .sync-bar {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 12px;
    }

    .sync-status {
      color: var(--muted);
      font-weight: 600;
    }

    .sync-btn {
      border: none;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 700;
    }

    /* ================= CONTAINER ================= */

    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
      animation: viewIn .25s ease;
    }

    @keyframes viewIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ================= CARDS ================= */

    .card {
      background: var(--card);
      border: 1px solid rgba(232,234,242,.8);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .hero-card {
      text-align: center;
      padding: 27px 20px 22px;
    }

    .camera-icon {
      width: 66px;
      height: 66px;
      border-radius: 21px;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 15px;
    }

    .hero-card h2 {
      font-size: 22px;
      margin-bottom: 7px;
    }

    .hero-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ================= CAMERA ================= */

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: #111;
      margin: 14px 0;
      display: none;
      min-height: 180px;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 18px;
      display: block;
    }

    #reader__dashboard {
      padding: 8px !important;
    }

    #reader__dashboard_section_csr button {
      border-radius: 10px !important;
      border: none !important;
      padding: 8px 12px !important;
    }

    .camera-status {
      display: none;
      background: var(--primary-light);
      color: var(--primary-dark);
      padding: 10px 13px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .scanner-controls {
      display: flex;
      gap: 10px;
    }

    .scanner-controls .btn {
      flex: 1;
    }

    /* ================= BUTTONS ================= */

    .btn {
      border: none;
      border-radius: 13px;
      padding: 13px 16px;
      min-height: 48px;
      font-size: 14px;
      font-weight: 750;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      transition: transform .12s ease, opacity .12s ease;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #8057eb);
      color: white;
      box-shadow: 0 8px 18px rgba(108,92,231,.2);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-success {
      background: var(--accent);
      color: white;
    }

    .btn-warning {
      background: var(--warning);
      color: white;
    }

    .btn-secondary {
      background: #eef0f6;
      color: var(--text);
    }

    /* ================= FORMS ================= */

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 800;
      color: #68718a;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--border);
      background: #fafbfe;
      border-radius: 13px;
      padding: 13px 14px;
      color: var(--text);
      outline: none;
      font-size: 14px;
      transition: border .2s, box-shadow .2s, background .2s;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(108,92,231,.08);
    }

    input:disabled {
      background: #f2f3f7;
      color: #8b92a5;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > * {
      flex: 1;
    }

    .code-row {
      display: flex;
      gap: 8px;
    }

    .code-row input {
      min-width: 0;
    }

    .code-row .btn {
      width: auto;
      min-width: 86px;
    }

    /* ================= RECOGNITION ================= */

    .recognition-status {
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 17px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .status-known {
      background: #e7faf3;
      color: #07855f;
      border: 1px solid #c5f1e2;
    }

    .status-new {
      background: #f0edff;
      color: #6650d8;
      border: 1px solid #dfd9ff;
    }

    .edit-btn {
      border: none;
      background: rgba(255,255,255,.7);
      color: inherit;
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
    }

    /* ================= FILTERS ================= */

    .filter-card {
      padding: 9px;
    }

    .filter-row {
      display: flex;
      gap: 7px;
    }

    .filter-tab {
      flex: 1;
      border: none;
      border-radius: 11px;
      background: #f1f2f7;
      color: var(--muted);
      padding: 11px 5px;
      font-size: 12px;
      font-weight: 800;
    }

    .filter-tab.active {
      background: var(--primary);
      color: white;
    }

    /* ================= RECORD CARDS ================= */

    .item-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 5px 18px rgba(40,44,70,.045);
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .item-details {
      min-width: 0;
      flex: 1;
    }

    .item-details h3 {
      font-size: 15px;
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .item-details p {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .item-action {
      flex-shrink: 0;
    }

    .retire-btn {
      border: none;
      background: #fff0f2;
      color: var(--danger);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 800;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 850;
    }

    .badge-vencido {
      background: #ffe4e8;
      color: #c52d47;
    }

    .badge-avencer {
      background: #fff1d8;
      color: #a86500;
    }

    .badge-ok {
      background: #dcf8ed;
      color: #087e59;
    }

    /* ================= CATALOG ================= */

    .catalog-intro {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .accordion {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(40,44,70,.035);
    }

    .accordion-header {
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .accordion-header span:last-child {
      color: var(--muted);
      transition: transform .2s;
    }

    .accordion.open .accordion-header span:last-child {
      transform: rotate(180deg);
    }

    .accordion-content {
      display: none;
      border-top: 1px solid var(--border);
      background: #fafbfe;
    }

    .accordion.open .accordion-content {
      display: block;
    }

    .catalog-item {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .catalog-item:last-child {
      border-bottom: none;
    }

    .catalog-item h4 {
      font-size: 13px;
      margin-bottom: 4px;
    }

    .catalog-item p {
      font-size: 10px;
      color: var(--muted);
    }

    /* ================= MODAL ================= */

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(25,28,45,.58);
      backdrop-filter: blur(4px);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 410px;
      background: white;
      border-radius: 22px;
      padding: 21px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      animation: modalIn .2s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(.97) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal h3 {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .modal-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }

    .radio-option input {
      width: auto;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .modal-buttons .btn {
      flex: 1;
    }

    /* ================= EMPTY ================= */

    .empty-state {
      text-align: center;
      padding: 45px 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .empty-icon {
      font-size: 32px;
      margin-bottom: 10px;
      opacity: .65;
    }

    /* ================= TOAST ================= */

    #toast {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%) translateY(15px);
      background: #25283a;
      color: white;
      padding: 12px 17px;
      border-radius: 13px;
      font-size: 12px;
      font-weight: 650;
      box-shadow: 0 8px 25px rgba(0,0,0,.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      max-width: calc(100vw - 35px);
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ================= NAV ================= */

    nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 78px;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      z-index: 300;
      box-shadow: 0 -5px 25px rgba(40,44,70,.06);
    }

    .nav-item {
      flex: 1;
      border: none;
      background: transparent;
      color: #9aa2b8;
      font-size: 10px;
      font-weight: 650;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }

    .nav-icon {
      width: 35px;
      height: 30px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 800;
    }

    .nav-item.active .nav-icon {
      background: var(--primary-light);
    }

    /* ================= DESKTOP ================= */

    @media (min-width: 700px) {
      body {
        padding-bottom: 30px;
      }

      nav {
        left: 50%;
        transform: translateX(-50%);
        width: 650px;
        bottom: 15px;
        border-radius: 22px;
        border: 1px solid var(--border);
      }

      .container {
        padding-top: 28px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header>
    <div class="header-inner">
      <div class="eyebrow">CONTROL INTELIGENTE</div>
      <h1>Control de Vencimientos</h1>
      <div class="header-subtitle">
        Registrá, controlá y encontrá tus productos fácilmente
      </div>
    </div>
  </header>

  <!-- MENSAJE DECORATIVO OCASIONAL -->

  <div id="love-message">
    <div class="love-inner">
      💜 Te amo amor mío
    </div>
  </div>

  <!-- ================= SYNC ================= -->

  <div class="sync-bar">
    <span id="sync-status" class="sync-status">
      🟡 Preparando aplicación...
    </span>

    <button class="sync-btn" onclick="triggerManualSync()">
      ↻ Sincronizar
    </button>
  </div>

  <main class="container">

    <!-- ========================================================= -->
    <!-- VISTA ESCANEAR -->
    <!-- ========================================================= -->

    <section id="view-scan" class="view active">

      <div class="card hero-card">

        <div class="camera-icon">📷</div>

        <h2>Registrar producto</h2>

        <p>
          Escaneá el código de barras o ingresalo manualmente.
        </p>

        <div id="camera-status" class="camera-status">
          📷 Solicitando acceso a la cámara...
        </div>

        <div id="reader"></div>

        <div class="scanner-controls">

          <button
            id="btn-start-scanner"
            class="btn btn-primary"
            onclick="startScanner()">
            📷 Abrir cámara
          </button>

          <button
            id="btn-stop-scanner"
            class="btn btn-danger"
            onclick="stopScanner()"
            style="display:none;">
            ✕ Cerrar cámara
          </button>

        </div>

        <div style="height:18px;"></div>

        <div class="form-group">

          <label for="reg-code">
            CÓDIGO DE BARRAS
          </label>

          <div class="code-row">

            <input
              type="text"
              id="reg-code"
              placeholder="Ej. 7791234567890"
              inputmode="numeric"
              autocomplete="off">

            <button
              class="btn btn-secondary"
              onclick="handleManualCodeInput()">
              Buscar
            </button>

          </div>

        </div>

      </div>

      <!-- FORMULARIO PRODUCTO -->

      <div
        class="card"
        id="product-form-card"
        style="display:none;">

        <div
          id="recognition-badge"
          class="recognition-status status-new">

          <span id="recognition-text">
            NUEVO PRODUCTO
          </span>

          <button
            id="btn-edit-catalog"
            class="edit-btn"
            onclick="enableCatalogEdit()"
            style="display:none;">
            Editar datos
          </button>

        </div>

        <form
          id="form-register-product"
          onsubmit="handleFormSubmit(event)">

          <div class="form-group">

            <label for="reg-category">
              CATEGORÍA
            </label>

            <input
              type="text"
              id="reg-category"
              list="dl-categories"
              placeholder="Ej. Alimentos"
              required
              disabled>

            <datalist id="dl-categories"></datalist>

          </div>

          <div class="form-group">

            <label for="reg-brand">
              MARCA
            </label>

            <input
              type="text"
              id="reg-brand"
              list="dl-brands"
              placeholder="Ej. La Serenísima"
              required
              disabled>

            <datalist id="dl-brands"></datalist>

          </div>

          <div class="form-group">

            <label for="reg-name">
              NOMBRE DEL PRODUCTO
            </label>

            <input
              type="text"
              id="reg-name"
              placeholder="Ej. Leche Entera 1L"
              required
              disabled>

          </div>

          <div
            id="box-save-catalog-btn"
            style="display:none; margin-bottom:16px;">

            <button
              type="button"
              class="btn btn-warning"
              onclick="saveCurrentCatalogEdit()">

              💾 Guardar en mi catálogo

            </button>

          </div>

          <div
            style="
              border-top:1px dashed var(--border);
              margin:18px 0;
            ">
          </div>

          <div class="row">

            <div class="form-group">

              <label for="reg-qty">
                CANTIDAD
              </label>

              <input
                type="number"
